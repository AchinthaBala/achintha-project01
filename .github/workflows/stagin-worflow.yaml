name: staging-workflow
on:
  push:
    branches:
      - develop
jobs:
  update-chnages-staging:
    runs-on: ubuntu-latest
    steps:
    - name: install ssh keys
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_KEY }}
        name: id_rsa
        known_hosts: ${{ secrets.KNOWN_HOSTS }}
    - name: ssh to the server
      run: >
        ssh ec2-user@13.221.130.203 -p 22 "
        cd /home/ec2-user/achintha-project01 &&
        git pull origin develop &&
        sudo docker build -t myapp:v2 . &&
        sudo docker container stop project1 &&
        sudo docker container rm project1
        sudo docker run -d -p 80:80 --name project1 myapp:v2"